<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Create Account — Community</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body class="auth-body">
<a class="skip-link" href="#main-content">Skip to content</a>

<header class="site-header site-header-minimal">
  <a class="site-logo" href="index.html">Community</a>
</header>

<main id="main-content" class="auth-main">
  <h1>Create Account</h1>

  <form id="register-form" class="auth-form" novalidate>
    <div class="field">
      <label for="reg-username">Username</label>
      <input type="text" id="reg-username" name="username" autocomplete="username" required>
      <p class="field-error" id="reg-username-error" role="alert"></p>
    </div>

    <div class="field">
      <label for="reg-display-name">Display name</label>
      <input type="text" id="reg-display-name" name="displayName" autocomplete="name" required>
      <p class="field-error" id="reg-display-name-error" role="alert"></p>
    </div>

    <div class="field">
      <label for="reg-email">Email</label>
      <input type="email" id="reg-email" name="email" autocomplete="email" required>
      <p class="field-error" id="reg-email-error" role="alert"></p>
    </div>

    <div class="field">
      <label for="reg-password">Password</label>
      <input type="password" id="reg-password" name="password" autocomplete="new-password" required>
      <p class="field-error" id="reg-password-error" role="alert"></p>
    </div>

    <div class="field">
      <label for="reg-password-confirm">Confirm password</label>
      <input type="password" id="reg-password-confirm" name="passwordConfirm" autocomplete="new-password" required>
      <p class="field-error" id="reg-password-confirm-error" role="alert"></p>
    </div>

    <div class="field">
      <label for="reg-avatar">Avatar (optional)</label>
      <input type="file" id="reg-avatar" name="avatar" accept="image/png,image/jpeg,image/webp">
    </div>

    <div id="register-form-status" class="state-region" role="status" aria-live="polite"></div>

    <button type="submit" class="btn btn-primary btn-block" id="register-submit">Create Account</button>
  </form>

  <p class="auth-links">
    Already have an account? <a href="login.html">Log in</a>
  </p>
</main>

<script type="module" src="js/config.js"></script>
<script type="module" src="js/supabase.js"></script>
<script type="module" src="js/utils.js"></script>
<script type="module" src="js/auth.js"></script>
</body>
</html>
