<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Settings — Community</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<a class="skip-link" href="#main-content">Skip to content</a>

<header class="site-header">
  <a class="site-logo" href="index.html">Community</a>
  <div class="header-actions">
    <button type="button" class="icon-btn hamburger-toggle" id="hamburger-toggle"
            aria-expanded="false" aria-controls="hamburger-menu" aria-label="Open menu">
      <span aria-hidden="true">☰</span>
    </button>
  </div>
</header>

<nav id="hamburger-menu" class="hamburger-menu" hidden aria-label="Secondary">
  <ul>
    <li><a href="search.html">Search</a></li>
    <li><a href="notifications.html">Notifications</a></li>
    <li><a href="settings.html">Settings</a></li>
    <li><a href="profile.html">Profile</a></li>
    <li><a href="forums.html">General</a></li>
    <li><a href="admin.html" id="admin-link" hidden>Admin</a></li>
    <li><button type="button" id="logout-btn">Log out</button></li>
  </ul>
</nav>

<main id="main-content">
  <h1>Settings</h1>

  <section aria-labelledby="theme-heading">
    <h2 id="theme-heading">Appearance</h2>
    <div class="field">
      <label for="theme-select">Theme</label>
      <select id="theme-select">
        <option value="dark">Dark</option>
        <option value="light">Light</option>
        <option value="system">Match system</option>
      </select>
    </div>
    <div class="field">
      <label for="accent-select">Accent color</label>
      <input type="color" id="accent-select" value="#5b8def">
    </div>
  </section>

  <section aria-labelledby="account-heading">
    <h2 id="account-heading">Account</h2>
    <form id="email-form" class="field-group" novalidate>
      <div class="field">
        <label for="settings-email">Email</label>
        <input type="email" id="settings-email">
      </div>
      <button type="submit" class="btn btn-secondary">Update Email</button>
    </form>

    <form id="password-form" class="field-group" novalidate>
      <div class="field">
        <label for="settings-new-password">New password</label>
        <input type="password" id="settings-new-password" autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-secondary">Update Password</button>
    </form>
    <div id="account-status" class="state-region" role="status" aria-live="polite"></div>
  </section>

  <section aria-labelledby="notifications-settings-heading">
    <h2 id="notifications-settings-heading">Notifications</h2>
    <div class="field field-inline">
      <label for="notify-comments">Comment notifications</label>
      <input type="checkbox" id="notify-comments" checked>
    </div>
    <div class="field field-inline">
      <label for="notify-replies">Reply notifications</label>
      <input type="checkbox" id="notify-replies" checked>
    </div>
  </section>

  <section aria-labelledby="privacy-heading">
    <h2 id="privacy-heading">Privacy</h2>
    <div class="field field-inline">
      <label for="privacy-show-follows">Show followers/following</label>
      <input type="checkbox" id="privacy-show-follows" checked>
    </div>
  </section>

  <section aria-labelledby="danger-heading">
    <h2 id="danger-heading">Danger Zone</h2>
    <button type="button" class="btn btn-danger" id="delete-account-btn">Delete Account</button>
    <div id="delete-account-panel" class="panel" hidden>
      <p>This permanently deletes your account. Type your username to confirm.</p>
      <input type="text" id="delete-confirm-input">
      <div id="delete-account-status" class="state-region" role="status" aria-live="polite"></div>
      <button type="button" class="btn btn-danger" id="delete-account-confirm-btn">Permanently Delete</button>
    </div>
  </section>
</main>

<nav class="bottom-nav" aria-label="Primary">
  <a href="index.html" class="bottom-nav-item">Home</a>
  <a href="forums.html" class="bottom-nav-item">General</a>
  <a href="profile.html" class="bottom-nav-item">Profile</a>
</nav>

<script type="module" src="js/config.js"></script>
<script type="module" src="js/supabase.js"></script>
<script type="module" src="js/utils.js"></script>
<script type="module" src="js/session.js"></script>
<script type="module" src="js/navigation.js"></script>
<script type="module" src="js/settings.js"></script>
</body>
</html>
