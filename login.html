<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Log In — Community</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body class="auth-body">
<a class="skip-link" href="#main-content">Skip to content</a>

<header class="site-header site-header-minimal">
  <a class="site-logo" href="index.html">Community</a>
</header>

<main id="main-content" class="auth-main">
  <h1>Log In</h1>

  <form id="login-form" class="auth-form" novalidate>
    <div class="field">
      <label for="login-identifier">Email or username</label>
      <input type="text" id="login-identifier" name="identifier" autocomplete="username" required>
      <p class="field-error" id="login-identifier-error" role="alert"></p>
    </div>

    <div class="field">
      <label for="login-password">Password</label>
      <input type="password" id="login-password" name="password" autocomplete="current-password" required>
      <p class="field-error" id="login-password-error" role="alert"></p>
    </div>

    <div id="login-form-status" class="state-region" role="status" aria-live="polite"></div>

    <button type="submit" class="btn btn-primary btn-block" id="login-submit">Log In</button>
  </form>

  <p class="auth-links">
    <a href="#" id="forgot-password-link">Forgot password?</a>
  </p>
  <p class="auth-links">
    New here? <a href="register.html">Create an account</a>
  </p>

  <div id="forgot-password-panel" class="panel" hidden>
    <h2>Reset password</h2>
    <div class="field">
      <label for="reset-email">Email</label>
      <input type="email" id="reset-email" autocomplete="email">
    </div>
    <div id="reset-status" class="state-region" role="status" aria-live="polite"></div>
    <button type="button" class="btn btn-secondary" id="reset-submit">Send reset link</button>
  </div>
</main>

<script type="module" src="js/config.js"></script>
<script type="module" src="js/supabase.js"></script>
<script type="module" src="js/utils.js"></script>
<script type="module" src="js/auth.js"></script>
</body>
</html>
