<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>(function(){try{var t=localStorage.getItem("community-site:theme")||"dark";var r=t==="system"?(window.matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"):t;document.documentElement.dataset.theme=r;var a=localStorage.getItem("community-site:accent");if(a)document.documentElement.style.setProperty("--accent",a);}catch(e){}})();</script>
<title>Search · Community</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<a class="skip-link" href="#main-content">Skip to content</a>

<header class="site-header">
  <a class="site-logo" href="index.html">Community</a>
  <div class="header-actions">
    <button type="button" class="icon-btn hamburger-toggle" id="hamburger-toggle"
            aria-expanded="false" aria-controls="hamburger-menu" aria-label="Open menu">
      <span aria-hidden="true"><svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/></svg></span>
    </button>
  </div>
</header>

<nav id="hamburger-menu" class="hamburger-menu" hidden aria-label="Secondary">
  <ul>
    <li><a href="search.html">Search</a></li>
    <li><a href="notifications.html">Notifications</a></li>
    <li><a href="settings.html">Settings</a></li>
    <li><a href="profile.html">Profile</a></li>
    <li><a href="forums.html">General</a></li>
    <li><a href="admin.html" id="admin-link" hidden>Admin</a></li>
    <li><button type="button" id="logout-btn">Log out</button></li>
  </ul>
</nav>

<main id="main-content">
  <h1>Search</h1>

  <div class="field">
    <label for="search-input" class="sr-only">Search posts, threads, and people</label>
    <input type="search" id="search-input" placeholder="Search posts, threads, people…">
  </div>

  <div class="tabs" role="tablist" aria-label="Search filters">
    <button type="button" role="tab" aria-selected="true" class="tab-btn" data-filter="all">All</button>
    <button type="button" role="tab" aria-selected="false" class="tab-btn" data-filter="posts">Posts</button>
    <button type="button" role="tab" aria-selected="false" class="tab-btn" data-filter="threads">Threads</button>
    <button type="button" role="tab" aria-selected="false" class="tab-btn" data-filter="users">People</button>
  </div>

  <div id="search-status" class="state-region" role="status" aria-live="polite"></div>
  <div id="search-results" class="search-results"></div>
</main>

<nav class="bottom-nav" aria-label="Primary">
  <a href="index.html" class="bottom-nav-item">Home</a>
  <a href="forums.html" class="bottom-nav-item">General</a>
  <a href="profile.html" class="bottom-nav-item">Profile</a>
</nav>

<script type="module" src="js/config.js"></script>
<script type="module" src="js/supabase.js"></script>
<script type="module" src="js/utils.js"></script>
<script type="module" src="js/session.js"></script>
<script type="module" src="js/navigation.js"></script>
<script type="module" src="js/components.js"></script>
<script type="module" src="js/search.js"></script>
</body>
</html>
