<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Home — Community</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<a class="skip-link" href="#main-content">Skip to content</a>

<header class="site-header">
  <a class="site-logo" href="index.html">Community</a>
  <div class="header-actions">
    <a href="notifications.html" class="icon-btn" aria-label="Notifications">
      <span class="badge" id="notif-badge" hidden>0</span>
      <span aria-hidden="true">🔔</span>
    </a>
    <button type="button" class="icon-btn hamburger-toggle" id="hamburger-toggle"
            aria-expanded="false" aria-controls="hamburger-menu" aria-label="Open menu">
      <span aria-hidden="true">☰</span>
    </button>
  </div>
</header>

<nav id="hamburger-menu" class="hamburger-menu" hidden aria-label="Secondary">
  <ul>
    <li><a href="search.html">Search</a></li>
    <li><a href="notifications.html">Notifications</a></li>
    <li><a href="settings.html">Settings</a></li>
    <li><a href="profile.html">Profile</a></li>
    <li><a href="forums.html">General</a></li>
    <li><a href="admin.html" id="admin-link" hidden>Admin</a></li>
    <li><button type="button" id="logout-btn">Log out</button></li>
  </ul>
</nav>

<main id="main-content">
  <section aria-labelledby="featured-heading" id="featured-section" hidden>
    <h2 id="featured-heading">Featured</h2>
    <div id="featured-list" class="post-list"></div>
  </section>

  <section aria-labelledby="feed-heading">
    <h1 id="feed-heading">Home</h1>
    <div id="feed-status" class="state-region" role="status" aria-live="polite"></div>
    <div id="feed-list" class="post-list"></div>
    <button type="button" id="feed-load-more" class="btn btn-secondary" hidden>Load more</button>
  </section>
</main>

<nav class="bottom-nav" aria-label="Primary">
  <a href="index.html" class="bottom-nav-item" aria-current="page">Home</a>
  <a href="forums.html" class="bottom-nav-item">General</a>
  <a href="profile.html" class="bottom-nav-item">Profile</a>
</nav>

<a href="create.html" id="create-post-fab" class="fab" hidden aria-label="Create post">+</a>

<script type="module" src="js/config.js"></script>
<script type="module" src="js/supabase.js"></script>
<script type="module" src="js/utils.js"></script>
<script type="module" src="js/session.js"></script>
<script type="module" src="js/navigation.js"></script>
<script type="module" src="js/components.js"></script>
<script type="module" src="js/feed.js"></script>
</body>
</html>
