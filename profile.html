<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>(function(){try{var t=localStorage.getItem("community-site:theme")||"dark";var r=t==="system"?(window.matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"):t;document.documentElement.dataset.theme=r;var a=localStorage.getItem("community-site:accent");if(a)document.documentElement.style.setProperty("--accent",a);}catch(e){}})();</script>
<title>Profile · Community</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<a class="skip-link" href="#main-content">Skip to content</a>

<header class="site-header">
  <a class="site-logo" href="index.html">Community</a>
  <div class="header-actions">
    <a href="notifications.html" class="icon-btn" aria-label="Notifications">
      <span class="badge" id="notif-badge" hidden>0</span>
      <span aria-hidden="true"><svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 3.2 1 5 2 6H4c1-1 2-2.8 2-6Z"/><path d="M9.5 19a2.5 2.5 0 0 0 5 0"/></svg></span>
    </a>
    <button type="button" class="icon-btn hamburger-toggle" id="hamburger-toggle"
            aria-expanded="false" aria-controls="hamburger-menu" aria-label="Open menu">
      <span aria-hidden="true"><svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/></svg></span>
    </button>
  </div>
</header>

<nav id="hamburger-menu" class="hamburger-menu" hidden aria-label="Secondary">
  <ul>
    <li><a href="search.html">Search</a></li>
    <li><a href="notifications.html">Notifications</a></li>
    <li><a href="settings.html">Settings</a></li>
    <li><a href="profile.html">Profile</a></li>
    <li><a href="forums.html">General</a></li>
    <li><a href="admin.html" id="admin-link" hidden>Admin</a></li>
    <li><button type="button" id="logout-btn">Log out</button></li>
  </ul>
</nav>

<main id="main-content">
  <div id="profile-status" class="state-region" role="status" aria-live="polite"></div>

  <div id="profile-view" hidden>
    <div class="profile-banner" id="profile-banner"></div>
    <img id="profile-avatar" class="profile-avatar" alt="">
    <h1 id="profile-display-name"></h1>
    <p id="profile-username" class="muted-text"></p>
    <span id="profile-role-badge" class="role-badge"></span>
    <p id="profile-bio"></p>

    <div id="profile-follow-stats" hidden>
      <span id="followers-count"></span> followers ·
      <span id="following-count"></span> following
      <button type="button" id="follow-toggle-btn" class="btn btn-secondary"></button>
    </div>

    <button type="button" id="edit-profile-btn" class="btn btn-secondary" hidden>Edit Profile</button>

    <section aria-labelledby="activity-heading">
      <h2 id="activity-heading">Activity</h2>
      <div id="profile-activity-list"></div>
    </section>
  </div>

  <form id="edit-profile-form" class="panel" hidden novalidate>
    <h2>Edit Profile</h2>
    <div class="field">
      <label for="edit-display-name">Display name</label>
      <input type="text" id="edit-display-name" required>
    </div>
    <div class="field">
      <label for="edit-username">Username</label>
      <input type="text" id="edit-username" required>
    </div>
    <div class="field">
      <label for="edit-bio">Bio</label>
      <textarea id="edit-bio"></textarea>
    </div>
    <div class="field">
      <label for="edit-avatar">Avatar</label>
      <input type="file" id="edit-avatar" accept="image/png,image/jpeg,image/webp">
    </div>
    <div class="field">
      <label for="edit-banner">Banner</label>
      <input type="file" id="edit-banner" accept="image/png,image/jpeg,image/webp">
    </div>
    <div id="edit-profile-status" class="state-region" role="status" aria-live="polite"></div>
    <div class="create-actions-row">
      <button type="button" class="btn btn-link" id="cancel-edit-profile">Cancel</button>
      <button type="submit" class="btn btn-primary">Save</button>
    </div>
  </form>
</main>

<nav class="bottom-nav" aria-label="Primary">
  <a href="index.html" class="bottom-nav-item">Home</a>
  <a href="forums.html" class="bottom-nav-item">General</a>
  <a href="profile.html" class="bottom-nav-item" aria-current="page">Profile</a>
</nav>

<script type="module" src="js/config.js"></script>
<script type="module" src="js/supabase.js"></script>
<script type="module" src="js/utils.js"></script>
<script type="module" src="js/session.js"></script>
<script type="module" src="js/navigation.js"></script>
<script type="module" src="js/components.js"></script>
<script type="module" src="js/follows.js"></script>
<script type="module" src="js/profile.js"></script>
</body>
</html>
