    <li><a href="settings.html"><svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.2M12 18.8V21M4.9 6.2l1.6 1.5M17.5 16.3l1.6 1.5M3 12h2.2M18.8 12H21M4.9 17.8l1.6-1.5M17.5 7.7l1.6-1.5"/></svg><span>Settings</span></a></li>
    <li><a href="profile.html"><svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c1.2-3.6 4-5.5 7-5.5s5.8 1.9 7 5.5"/></svg><span>Profile</span></a></li>
    <li><a href="forums.html"><svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><path d="M4 5h16v11H8l-4 4V5Z"/></svg><span>General</span></a></li>
    <li><a href="general-processing.html"><svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><path d="M3 8a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-4V8Z"/><path d="M14 6v12" stroke-dasharray="2 2"/></svg><span>General Processing</span></a></li>
    <li><a href="admin.html" id="admin-link" hidden><svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3Z"/></svg><span>Admin</span></a></li>

  </ul>

<main id="main-content" class="admin-main">
  <div id="admin-guard-status" class="state-region" role="status" aria-live="polite"></div>

  <div id="admin-content" hidden>
    <h1>Admin</h1>

    <div class="tabs" role="tablist" aria-label="Admin sections">
      <button type="button" role="tab" aria-selected="true" class="tab-btn" data-panel="users-panel">Users</button>
      <button type="button" role="tab" aria-selected="false" class="tab-btn" data-panel="reports-panel">Reports</button>
      <button type="button" role="tab" aria-selected="false" class="tab-btn" data-panel="forum-panel">Forum</button>
      <button type="button" role="tab" aria-selected="false" class="tab-btn" data-panel="audit-panel">Audit Log</button>
      <button type="button" role="tab" aria-selected="false" class="tab-btn" data-panel="site-panel">Site Settings</button>
    </div>

    <section id="users-panel" class="admin-panel" aria-labelledby="users-heading">
      <h2 id="users-heading">Users</h2>
      <div class="field">
        <label for="user-search-input" class="sr-only">Search users</label>
        <input type="search" id="user-search-input" placeholder="Search users…">
      </div>
      <div id="users-status" class="state-region" role="status" aria-live="polite"></div>
      <ul id="users-list" class="admin-list"></ul>
    </section>

    <section id="reports-panel" class="admin-panel" aria-labelledby="reports-heading" hidden>
      <h2 id="reports-heading">Reports</h2>
      <div id="reports-status" class="state-region" role="status" aria-live="polite"></div>
      <ul id="reports-list" class="admin-list"></ul>
    </section>

    <section id="forum-panel" class="admin-panel" aria-labelledby="forum-mgmt-heading" hidden>
      <h2 id="forum-mgmt-heading">Forum Management</h2>
      <div id="forum-mgmt-status" class="state-region" role="status" aria-live="polite"></div>
      <ul id="forum-mgmt-list" class="admin-list"></ul>
    </section>

    <section id="audit-panel" class="admin-panel" aria-labelledby="audit-heading" hidden>
      <h2 id="audit-heading">Audit Log</h2>
      <div id="audit-status" class="state-region" role="status" aria-live="polite"></div>
      <ul id="audit-list" class="admin-list"></ul>
    </section>

    <section id="site-panel" class="admin-panel" aria-labelledby="site-settings-heading" hidden>
      <h2 id="site-settings-heading">Site Settings</h2>
      <form id="site-settings-form" novalidate>
        <div class="field">
          <label for="max-file-size-input">Max file size (MB)</label>
          <input type="number" id="max-file-size-input" min="1" max="500">
        </div>
        <div class="field">
          <label for="max-files-input">Max files per post</label>
          <input type="number" id="max-files-input" min="1" max="50">
        </div>
        <div id="site-settings-status" class="state-region" role="status" aria-live="polite"></div>
        <button type="submit" class="btn btn-primary">Save</button>
      </form>
    </section>
  </div>
</main>

<nav class="bottom-nav" aria-label="Primary">
    <a href="index.html" class="bottom-nav-item"><svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9a1 1 0 0 0 1 1h4v-6h2v6h4a1 1 0 0 0 1-1v-9"/></svg><span>Home</span></a>
    <a href="forums.html" class="bottom-nav-item"><svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><path d="M4 5h16v11H8l-4 4V5Z"/></svg><span>General</span></a>
    <a href="profile.html" class="bottom-nav-item"><svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c1.2-3.6 4-5.5 7-5.5s5.8 1.9 7 5.5"/></svg><span>Profile</span></a>
</nav>
