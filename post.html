<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>(function(){try{var t=localStorage.getItem("community-site:theme")||"dark";var r=t==="system"?(window.matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"):t;document.documentElement.dataset.theme=r;var a=localStorage.getItem("community-site:accent");if(a)document.documentElement.style.setProperty("--accent",a);}catch(e){}})();</script>
<title>Post · Community</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<a class="skip-link" href="#main-content">Skip to content</a>

<header class="site-header">
  <a class="site-logo" href="index.html">Community</a>
  <div class="header-actions">
    <a href="notifications.html" class="icon-btn" aria-label="Notifications">
      <span class="badge" id="notif-badge" hidden>0</span>
      <span aria-hidden="true"><svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 3.2 1 5 2 6H4c1-1 2-2.8 2-6Z"/><path d="M9.5 19a2.5 2.5 0 0 0 5 0"/></svg></span>
    </a>
    <button type="button" class="icon-btn hamburger-toggle" id="hamburger-toggle"
            aria-expanded="false" aria-controls="hamburger-menu" aria-label="Open menu">
      <span class="hamburger-bars" aria-hidden="true"><span class="bar"></span><span class="bar"></span><span class="bar"></span></span>
    </button>
  </div>
</header>

<div class="menu-backdrop" id="menu-backdrop" hidden></div>
<nav id="hamburger-menu" class="hamburger-menu" hidden aria-label="Secondary">
  <div class="hamburger-menu-header">
    <span class="hamburger-menu-title">Menu</span>
    <button type="button" class="icon-btn" id="hamburger-close" aria-label="Close menu"><svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><path d="M6 6l12 12"/><path d="M18 6 6 18"/></svg></button>
  </div>
  <ul>
    <li><a href="search.html"><svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="m20 20-3.5-3.5"/></svg><span>Search</span></a></li>
    <li><a href="notifications.html"><svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 3.2 1 5 2 6H4c1-1 2-2.8 2-6Z"/><path d="M9.5 19a2.5 2.5 0 0 0 5 0"/></svg><span>Notifications</span></a></li>
    <li><a href="settings.html"><svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.2M12 18.8V21M4.9 6.2l1.6 1.5M17.5 16.3l1.6 1.5M3 12h2.2M18.8 12H21M4.9 17.8l1.6-1.5M17.5 7.7l1.6-1.5"/></svg><span>Settings</span></a></li>
    <li><a href="profile.html"><svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c1.2-3.6 4-5.5 7-5.5s5.8 1.9 7 5.5"/></svg><span>Profile</span></a></li>
    <li><a href="forums.html"><svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><path d="M4 5h16v11H8l-4 4V5Z"/></svg><span>General</span></a></li>
    <li><a href="general-processing.html"><svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><path d="M3 8a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-4V8Z"/><path d="M14 6v12" stroke-dasharray="2 2"/></svg><span>General Processing</span></a></li>
    <li><a href="admin.html" id="admin-link" hidden><svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3Z"/></svg><span>Admin</span></a></li>
  </ul>
  <div class="hamburger-menu-divider"></div>
  <ul>
    <li><button type="button" id="logout-btn" class="hamburger-logout"><svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><path d="M14 4h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-4"/><path d="M10 8l-4 4 4 4"/><path d="M6 12h12"/></svg><span>Log out</span></button></li>
  </ul>
</nav>

<main id="main-content">
  <div id="post-status" class="state-region" role="status" aria-live="polite"></div>

  <article id="post-article" hidden>
    <header id="post-header"></header>
    <h1 id="post-title" class="post-title" hidden></h1>
    <div id="post-content" class="post-content post-content--main"></div>
    <div id="post-poll"></div>
    <div id="post-attachments" class="attachment-grid"></div>

    <div class="post-actions">
      <div id="post-reactions"></div>
      <div class="post-actions-spacer"></div>
      <div class="overflow-menu">
        <button type="button" id="post-overflow-btn" class="icon-btn" aria-haspopup="true" aria-expanded="false" aria-controls="post-overflow-menu" aria-label="More options">
          <svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
        </button>
        <div id="post-overflow-menu" class="overflow-menu-panel" hidden>
          <button type="button" id="post-report-btn">Report</button>
          <div id="post-owner-actions" hidden>
            <a href="#" id="post-edit-link">Edit</a>
            <button type="button" id="post-delete-btn" class="danger">Delete</button>
          </div>
        </div>
      </div>
    </div>

    <section aria-labelledby="comments-heading" id="comments-section">
      <h2 id="comments-heading">Comments</h2>
      <form id="comment-form" class="chat-composer">
        <label for="comment-input" class="sr-only">Write a comment</label>
        <textarea id="comment-input" rows="1" placeholder="Add a comment…"></textarea>
        <button type="submit" class="chat-composer-send" aria-label="Post comment">
          <svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><path d="M4 20l16-8L4 4v6l10 2-10 2v6Z"/></svg>
        </button>
      </form>
      <div id="comments-status" class="state-region" role="status" aria-live="polite"></div>
      <ul id="comments-list" class="comment-list"></ul>
    </section>
  </article>
</main>

<nav class="bottom-nav" aria-label="Primary">
    <a href="index.html" class="bottom-nav-item"><svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9a1 1 0 0 0 1 1h4v-6h2v6h4a1 1 0 0 0 1-1v-9"/></svg><span>Home</span></a>
    <a href="forums.html" class="bottom-nav-item"><svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><path d="M4 5h16v11H8l-4 4V5Z"/></svg><span>General</span></a>
    <a href="profile.html" class="bottom-nav-item"><svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c1.2-3.6 4-5.5 7-5.5s5.8 1.9 7 5.5"/></svg><span>Profile</span></a>
</nav>

<script type="module" src="js/config.js"></script>
<script type="module" src="js/supabase.js"></script>
<script type="module" src="js/utils.js"></script>
<script type="module" src="js/session.js"></script>
<script type="module" src="js/navigation.js"></script>
<script type="module" src="js/components.js"></script>
<script type="module" src="js/attachments.js"></script>
<script type="module" src="js/reactions.js"></script>
<script type="module" src="js/comments.js"></script>
<script type="module" src="js/post.js"></script>
</body>
</html>
